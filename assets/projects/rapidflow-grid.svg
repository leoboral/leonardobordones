<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">RapidFlow project card visual</title>
  <desc id="desc">Vibrant gradient visual with bold typography for RapidFlow project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b3d" />
      <stop offset="38%" stop-color="#ffcc33" />
      <stop offset="100%" stop-color="#5f56ff" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)" />
  <rect width="1600" height="1100" fill="url(#glow)" />
  <circle cx="1310" cy="220" r="210" fill="#00d1ff" fill-opacity="0.45" />
  <circle cx="1240" cy="940" r="300" fill="#ff2aa0" fill-opacity="0.35" />
  <text x="84" y="560" font-family="Inter, Arial, sans-serif" font-size="152" font-weight="900" letter-spacing="-3" fill="#0d0d0d">RAPIDFLOW</text>
  <text x="88" y="660" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="#111111">SAAS PRODUCT</text>
</svg>
