<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Finance Digitalization project card visual</title>
  <desc id="desc">Rich colorful visual with large bold typography for Finance Digitalization project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a11cb" />
      <stop offset="45%" stop-color="#2575fc" />
      <stop offset="100%" stop-color="#23d5ab" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)" />
  <circle cx="1300" cy="190" r="190" fill="#ffd166" fill-opacity="0.34" />
  <circle cx="1220" cy="930" r="280" fill="#ff7eb6" fill-opacity="0.3" />
  <text x="88" y="560" font-family="Inter, Arial, sans-serif" font-size="138" font-weight="900" letter-spacing="-3" fill="#f7f7f7">FINANCE</text>
  <text x="88" y="670" font-family="Inter, Arial, sans-serif" font-size="118" font-weight="900" letter-spacing="-2" fill="#f7f7f7">DIGITALIZATION</text>
