    <rect x="224" y="244" width="942" height="92" rx="20" fill="#f1f7ec" fill-opacity="0.1"/>
    <rect x="260" y="278" width="148" height="18" rx="9" fill="#b9ee59"/>
    <rect x="452" y="278" width="526" height="18" rx="9" fill="#d9e5cf" fill-opacity="0.22"/>
    <g fill="#fbfbf5">
      <rect x="224" y="388" width="278" height="392" rx="22"/>
      <rect x="546" y="388" width="278" height="392" rx="22"/>
      <rect x="868" y="388" width="278" height="392" rx="22"/>
    </g>
    <g fill="#183f20">
      <rect x="262" y="438" width="118" height="16" rx="8"/>
      <rect x="584" y="438" width="118" height="16" rx="8"/>
      <rect x="906" y="438" width="118" height="16" rx="8"/>
    </g>
    <g fill="#d9e5cf">
      <rect x="262" y="500" width="202" height="70" rx="14"/>
      <rect x="262" y="606" width="170" height="70" rx="14"/>
      <rect x="584" y="500" width="202" height="70" rx="14"/>
      <rect x="584" y="606" width="202" height="70" rx="14"/>
      <rect x="906" y="500" width="202" height="70" rx="14"/>
