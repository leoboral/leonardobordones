<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Operations Digitalization project card visual</title>
  <desc id="desc">Operations workflow visual with structured lanes and measured green accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f7ec"/>
      <stop offset="100%" stop-color="#fbfbf5"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#183f20" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#183f20" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
