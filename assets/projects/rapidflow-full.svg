<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1300" viewBox="0 0 2400 1300" role="img" aria-labelledby="title desc">
  <title id="title">RapidFlow project full visual</title>
  <desc id="desc">Vibrant full-width gradient visual with oversized typography for RapidFlow case study.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6f3f" />
      <stop offset="44%" stop-color="#ffd34a" />
      <stop offset="100%" stop-color="#5e58ff" />
    </linearGradient>
  </defs>
  <rect width="2400" height="1300" fill="url(#bg)" />
  <circle cx="420" cy="240" r="260" fill="#ffffff" fill-opacity="0.28" />
  <circle cx="2010" cy="1010" r="380" fill="#ff2aa0" fill-opacity="0.34" />
  <circle cx="1980" cy="250" r="230" fill="#00d2ff" fill-opacity="0.34" />
  <text x="150" y="640" font-family="Inter, Arial, sans-serif" font-size="248" font-weight="900" letter-spacing="-6" fill="#0f0f0f">RAPIDFLOW</text>
  <text x="160" y="770" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="2" fill="#101010">SAAS PRODUCT FOR E-COMMERCE</text>
</svg>
